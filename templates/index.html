<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nanoparticle Toxicity Predictor</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { color: #2c3e50; }
    form { margin-top: 20px; }
    input, button { padding: 10px; margin: 5px; }
    .result { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Nanoparticle Toxicity Predictor</h1>
  <p>Enter physicochemical properties to predict toxicity:</p>
  
  <form action="/predict" method="post">
    <label>Property 1: <input type="text" name="prop1" required></label><br>
    <label>Property 2: <input type="text" name="prop2" required></label><br>
    <label>Property 3: <input type="text" name="prop3" required></label><br>
    <label>Property 4: <input type="text" name="prop4" required></label><br>
    <button type="submit">Predict</button>
  </form>

  {% if prediction %}
    <div class="result">
      Prediction: {{ prediction }}
    </div>
  {% endif %}
</body>
</html>
